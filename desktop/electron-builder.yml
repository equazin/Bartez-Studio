appId: ar.com.bartez.erp
productName: Bartez ERP
copyright: © Bartez Tecnología

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

extraResources:
  - from: build/icon.png
    to: icon.png

protocols:
  - name: Bartez ERP
    schemes:
      - bartez

# --- Windows: instalador NSIS (.exe) ---
win:
  target:
    - nsis
  artifactName: ${productName}-Setup-${version}.${ext}
  icon: build/icon.ico
  # Firma de código: requiere certificado EV/OV.
  # Opciones:
  #   1. Variable de entorno CSC_LINK (ruta al .pfx) + CSC_KEY_PASSWORD
  #   2. Windows Certificate Store: certificateSubjectName
  # Descomentar cuando se tenga certificado:
  # signingHashAlgorithms:
  #   - sha256
  # certificateSubjectName: "Bartez Tecnología SRL"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Bartez ERP
  menuCategory: true
  deleteAppDataOnUninstall: false

# --- Auto-update vía GitHub Releases ---
publish:
  provider: github
  owner: equazin
  repo: Bartez-Studio
  releaseType: release

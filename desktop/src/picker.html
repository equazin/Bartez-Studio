<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;" />
  <title>Bartez ERP — Configuración</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #070a16;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow-y: auto;
    }
    .card {
      width: 100%;
      max-width: 440px;
      padding: 36px 36px 28px;
      text-align: center;
    }
    .logo {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .logo span { color: #38bdf8; }
    .tagline {
      margin-top: 6px;
      font-size: 13px;
      color: #64748b;
    }

    /* --- History section --- */
    .history { margin-top: 28px; text-align: left; display: none; }
    .history.visible { display: block; }
    .history-label {
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 10px;
    }
    .history-list { display: flex; flex-direction: column; gap: 6px; }
    .server-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: #0f1424;
      border: 1px solid #1e293b;
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .server-card:hover {
      border-color: #38bdf8;
      background: #111827;
    }
    .server-card:focus-visible {
      outline: 2px solid #38bdf8;
      outline-offset: 2px;
    }
    .server-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #334155;
      flex-shrink: 0;
    }
    .server-dot.online { background: #22c55e; }
    .server-info { flex: 1; min-width: 0; }
    .server-url-text {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .server-time {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
    }
    .server-remove {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: #475569;
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: color 0.15s, background 0.15s;
    }
    .server-remove:hover { color: #f87171; background: #1e293b; }

    .divider {
      margin: 24px 0 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #1e293b;
    }
    .divider-text {
      font-size: 11px;
      color: #475569;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* --- Manual entry --- */
    .title {
      margin-top: 28px;
      font-size: 16px;
      font-weight: 600;
      color: #f1f5f9;
    }
    .subtitle {
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.5;
      color: #94a3b8;
    }
    .field { margin-top: 20px; text-align: left; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      font-size: 14px;
      color: #f8fafc;
      background: #0f1424;
      border: 1px solid #1e293b;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      user-select: text;
    }
    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }
    button.btn-connect {
      width: 100%;
      height: 44px;
      margin-top: 16px;
      font-size: 14px;
      font-weight: 700;
      color: #03131f;
      background: #38bdf8;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }
    button.btn-connect:hover:not(:disabled) { background: #7dd3fc; }
    button.btn-connect:active:not(:disabled) { transform: scale(0.99); }
    button.btn-connect:disabled { opacity: 0.55; cursor: default; }
    .status {
      margin-top: 14px;
      font-size: 12.5px;
      min-height: 18px;
      line-height: 1.4;
    }
    .status.error { color: #f87171; }
    .status.ok { color: #34d399; }
    .status.loading { color: #94a3b8; }
    .hint {
      margin-top: 18px;
      font-size: 11.5px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Bartez<span> ERP</span></div>
    <div class="tagline">Distribución IT para empresas</div>

    <!-- Server history -->
    <div class="history" id="historySection">
      <div class="history-label">Servidores recientes</div>
      <div class="history-list" id="historyList"></div>
      <div class="divider"><span class="divider-text">o conectar a otro</span></div>
    </div>

    <!-- Manual entry -->
    <div id="manualSection">
      <div class="title" id="manualTitle">Conectá con tu servidor</div>
      <div class="subtitle">Ingresá la dirección del ERP que te asignó tu administrador.</div>
      <div class="field">
        <label for="url">Dirección del servidor</label>
        <input id="url" type="text" placeholder="https://bartez.com.ar" autocomplete="off" spellcheck="false" />
      </div>
      <button class="btn-connect" id="connect">Conectar</button>
      <div class="status" id="status"></div>
      <div class="hint">La dirección se guarda de forma segura en este equipo.</div>
    </div>
  </div>

  <script>
    const input = document.getElementById("url");
    const button = document.getElementById("connect");
    const status = document.getElementById("status");
    const historySection = document.getElementById("historySection");
    const historyList = document.getElementById("historyList");
    const manualTitle = document.getElementById("manualTitle");

    function setStatus(text, kind) {
      status.textContent = text;
      status.className = "status" + (kind ? " " + kind : "");
    }

    function timeAgo(ts) {
      const diff = Date.now() - ts;
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return "Justo ahora";
      if (mins < 60) return `Hace ${mins} min`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `Hace ${hours}h`;
      const days = Math.floor(hours / 24);
      return `Hace ${days}d`;
    }

    function renderHistory(entries) {
      if (!entries || entries.length === 0) {
        historySection.classList.remove("visible");
        manualTitle.textContent = "Conectá con tu servidor";
        return;
      }
      historySection.classList.add("visible");
      manualTitle.textContent = "Nuevo servidor";
      historyList.innerHTML = "";

      entries.forEach((entry) => {
        const card = document.createElement("div");
        card.className = "server-card";
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute("aria-label", "Conectar a " + entry.url);

        let hostname = entry.url;
        try { hostname = new URL(entry.url).hostname; } catch {}

        card.innerHTML =
          '<div class="server-dot" id="dot-' + encodeURIComponent(entry.url) + '"></div>' +
          '<div class="server-info">' +
            '<div class="server-url-text">' + hostname + '</div>' +
            '<div class="server-time">' + timeAgo(entry.lastUsed) + '</div>' +
          '</div>';

        const removeBtn = document.createElement("button");
        removeBtn.className = "server-remove";
        removeBtn.innerHTML = "×";
        removeBtn.title = "Eliminar del historial";
        removeBtn.addEventListener("click", async (e) => {
          e.stopPropagation();
          const updated = await window.bartezSetup.removeFromHistory(entry.url);
          renderHistory(updated);
        });
        card.appendChild(removeBtn);

        const connectToServer = async () => {
          setStatus("Conectando a " + hostname + "…", "loading");
          button.disabled = true;
          const result = await window.bartezSetup.set(entry.url);
          if (result && result.ok) {
            setStatus("Conectado. Abriendo…", "ok");
          } else {
            setStatus((result && result.error) || "No se pudo conectar.", "error");
            button.disabled = false;
          }
        };
        card.addEventListener("click", connectToServer);
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); connectToServer(); }
        });

        historyList.appendChild(card);
      });
    }

    async function connect() {
      const value = input.value.trim();
      if (!value) {
        setStatus("Ingresá una dirección.", "error");
        input.focus();
        return;
      }
      button.disabled = true;
      setStatus("Conectando…", "loading");
      try {
        const result = await window.bartezSetup.set(value);
        if (result && result.ok) {
          setStatus("Conectado. Abriendo…", "ok");
        } else {
          setStatus((result && result.error) || "No se pudo conectar.", "error");
          button.disabled = false;
        }
      } catch (e) {
        setStatus("Error inesperado al conectar.", "error");
        button.disabled = false;
      }
    }

    button.addEventListener("click", connect);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") connect();
    });

    // Load history and prefill
    window.bartezSetup.getHistory().then(renderHistory);
    window.bartezSetup.getCurrent().then((url) => {
      if (url) input.value = url;
      input.focus();
    });
  </script>
</body>
</html>

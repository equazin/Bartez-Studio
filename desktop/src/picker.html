<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;" />
  <title>Bartez ERP — Configuración</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #070a16;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .card {
      width: 100%;
      max-width: 440px;
      padding: 40px 36px;
      text-align: center;
    }
    .logo {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .logo span { color: #38bdf8; }
    .tagline {
      margin-top: 6px;
      font-size: 13px;
      color: #64748b;
    }
    .title {
      margin-top: 36px;
      font-size: 16px;
      font-weight: 600;
      color: #f1f5f9;
    }
    .subtitle {
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.5;
      color: #94a3b8;
    }
    .field { margin-top: 28px; text-align: left; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      font-size: 14px;
      color: #f8fafc;
      background: #0f1424;
      border: 1px solid #1e293b;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      user-select: text;
    }
    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }
    button {
      width: 100%;
      height: 44px;
      margin-top: 20px;
      font-size: 14px;
      font-weight: 700;
      color: #03131f;
      background: #38bdf8;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }
    button:hover:not(:disabled) { background: #7dd3fc; }
    button:active:not(:disabled) { transform: scale(0.99); }
    button:disabled { opacity: 0.55; cursor: default; }
    .status {
      margin-top: 16px;
      font-size: 12.5px;
      min-height: 18px;
      line-height: 1.4;
    }
    .status.error { color: #f87171; }
    .status.ok { color: #34d399; }
    .status.loading { color: #94a3b8; }
    .hint {
      margin-top: 22px;
      font-size: 11.5px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Bartez<span> ERP</span></div>
    <div class="tagline">Distribución IT para empresas</div>

    <div class="title">Conectá con tu servidor</div>
    <div class="subtitle">Ingresá la dirección del ERP que te asignó tu administrador.</div>

    <div class="field">
      <label for="url">Dirección del servidor</label>
      <input id="url" type="text" placeholder="https://bartez.com.ar" autocomplete="off" spellcheck="false" />
    </div>

    <button id="connect">Conectar</button>
    <div class="status" id="status"></div>

    <div class="hint">La dirección se guarda de forma segura en este equipo.</div>
  </div>

  <script>
    const input = document.getElementById("url");
    const button = document.getElementById("connect");
    const status = document.getElementById("status");

    function setStatus(text, kind) {
      status.textContent = text;
      status.className = "status" + (kind ? " " + kind : "");
    }

    async function connect() {
      const value = input.value.trim();
      if (!value) {
        setStatus("Ingresá una dirección.", "error");
        input.focus();
        return;
      }
      button.disabled = true;
      setStatus("Conectando…", "loading");
      try {
        const result = await window.bartezSetup.set(value);
        if (result && result.ok) {
          setStatus("Conectado. Abriendo…", "ok");
          // El proceso principal abre la ventana del ERP y cierra esta.
        } else {
          setStatus((result && result.error) || "No se pudo conectar.", "error");
          button.disabled = false;
        }
      } catch (e) {
        setStatus("Error inesperado al conectar.", "error");
        button.disabled = false;
      }
    }

    button.addEventListener("click", connect);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") connect();
    });

    // Prefill si ya había un servidor previo.
    window.bartezSetup.getCurrent().then((url) => {
      if (url) input.value = url;
      input.focus();
    });
  </script>
</body>
</html>
